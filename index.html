<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Tarefas Escolares</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <header class="text-center mb-4">
            <h1>
                <i class="fa-solid fa-list-check"></i>
                Sistema de Tarefas
            </h1>

            <p>Organize suas tarefas escolares de forma simples.</p>
        </header>

        <!-- Formulário -->
        <section class="card shadow p-4 mb-4">

            <h2 class="mb-3">
                <i class="fa-solid fa-plus"></i>
                Nova tarefa
            </h2>

            <form id="formTarefa">

                <div class="mb-3">
                    <label for="nome">Nome da tarefa</label>
                    <input
                        type="text"
                        id="nome"
                        class="form-control"
                        placeholder="Ex: Trabalho de Matemática"
                    >
                </div>

                <div class="mb-3">
                    <label for="disciplina">Disciplina</label>
                    <input
                        type="text"
                        id="disciplina"
                        class="form-control"
                        placeholder="Ex: Matemática"
                    >
                </div>

                <div class="mb-3">
                    <label for="data">Data de entrega</label>
                    <input
                        type="date"
                        id="data"
                        class="form-control"
                    >
                </div>

                <div class="mb-3">
                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade" class="form-select">
                        <option value="">Selecione</option>
                        <option value="Baixa">Baixa</option>
                        <option value="Média">Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="situacao">Situação</label>

                    <select id="situacao" class="form-select">
                        <option value="">Selecione</option>
                        <option value="Pendente">Pendente</option>
                        <option value="Em andamento">Em andamento</option>
                        <option value="Concluída">Concluída</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    <i class="fa-solid fa-plus"></i>
                    Adicionar tarefa
                </button>

            </form>

            <div id="mensagem"></div>

        </section>

        <!-- Lista -->
        <section>

            <h2 class="mb-3">
                <i class="fa-solid fa-tasks"></i>
                Minhas tarefas
            </h2>

            <div id="listaTarefas"></div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
